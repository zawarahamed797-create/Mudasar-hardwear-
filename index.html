<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudasar Hardware Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1e272e; --accent: #f39c12; --bg: #f1f2f6; --success: #27ae60; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); }
        
        header { background: var(--primary); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent); text-decoration: none; }

        .hero { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1581147036324-c17ac41dfa6c?q=80&w=1200'); height: 150px; background-size: cover; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; padding-bottom: 15px; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        /* Cart Panel */
        #cart-panel { position: fixed; right: -400px; top: 0; width: 350px; height: 100%; background: white; shadow: -5px 0 15px rgba(0,0,0,0.2); transition: 0.4s; z-index: 2000; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; }
        #cart-panel.active { right: 0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
        .qty-btn { background: #eee; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        
        .cart-btn-float { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 24px; }
        .cart-count { position: absolute; top: 0; right: 0; background: var(--accent); color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; display: flex; justify-content: center; align-items: center; }
        
        .whatsapp-btn { background: #25D366; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; display: block; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">MUDASAR HARDWARE</a>
    <div><i class="fas fa-phone"></i> +92 321 7742445</div>
</header>

<div class="hero">
    <h1>Hardware & Fittings</h1>
    <p>Wholesale Rates Store</p>
</div>

<div class="container">
    <div class="grid">
        <div class="card">
            <img src="2×6.jpg" alt="Screws">
            <h3>Screws 2×6</h3>
            <p>Rs. 250 (Box)</p>
            <button class="btn-add" onclick="addToCart('Screws 2×6', 250)">Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1622350831002-3f86e3444053?w=400" alt="Hinges">
            <h3>Auto Hinges (Qabzy)</h3>
            <p>Rs. 580 (Pair)</p>
            <button class="btn-add" onclick="addToCart('Auto Hinges', 580)">Add to Cart</button>
        </div>
    </div>
</div>

<div class="cart-btn-float" onclick="toggleCart(true)">
    <i class="fas fa-shopping-cart"></i>
    <span class="cart-count">0</span>
</div>

<div id="cart-panel">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <h2>Aapka Cart</h2>
        <button onclick="toggleCart(false)" style="border:none; background:none; font-size:20px; cursor:pointer;">&times;</button>
    </div>
    
    <div class="cart-items-list" style="flex-grow:1; overflow-y:auto;">
        </div>

    <div style="background:#f9f9f9; padding:15px; border-radius:8px;">
        <p>Total: <b id="total-price">Rs. 0</b></p>
        <p>Advance (50%): <b id="advance-price">Rs. 0</b></p>
        <a href="javascript:void(0)" class="whatsapp-btn" onclick="sendWhatsApp()">Confirm on WhatsApp</a>
    </div>
</div>

<script>
    let cart = [];

    function addToCart(name, price) {
        // Check agar item pehle se hai
        let existingItem = cart.find(item => item.name === name);

        if (existingItem) {
            existingItem.quantity += 1; // 2 bar click karne se quantity barhay gi
        } else {
            cart.push({ name: name, price: price, quantity: 1 });
        }
        updateUI();
        toggleCart(true);
    }

    function changeQty(index, delta) {
        cart[index].quantity += delta;
        if (cart[index].quantity < 1) {
            cart.splice(index, 1); // Agar 0 ho jaye to delete kar do
        }
        updateUI();
    }

    function updateUI() {
        const list = document.querySelector('.cart-items-list');
        const count = document.querySelector('.cart-count');
        const totalDisp = document.getElementById('total-price');
        const advDisp = document.getElementById('advance-price');

        list.innerHTML = '';
        let total = 0;
        let totalQty = 0;

        cart.forEach((item, index) => {
            total += (item.price * item.quantity);
            totalQty += item.quantity;
            list.innerHTML += `
                <div class="cart-item">
                    <div>
                        <b>${item.name}</b><br>
                        <small>Rs. ${item.price}</small>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                    </div>
                </div>
            `;
        });

        count.innerText = totalQty;
        totalDisp.innerText = `Rs. ${total}`;
        advDisp.innerText = `Rs. ${total * 0.5}`;
    }

    function toggleCart(status) {
        document.getElementById('cart-panel').classList.toggle('active', status);
    }

    function sendWhatsApp() {
        if (cart.length === 0) return alert("Cart khali hai!");
        let text = "Salam Mudasar Hardware! Mera Order:\n\n";
        cart.forEach(item => {
            text += `• ${item.name} (${item.quantity} x ${item.price}) = Rs. ${item.price * item.quantity}\n`;
        });
        let total = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
        text += `\n*Total: Rs. ${total}*`;
        text += `\n*Advance: Rs. ${total * 0.5}*`;
        window.open(`https://wa.me/923217742445?text=${encodeURIComponent(text)}`);
    }
</script>

</body>
</html>
