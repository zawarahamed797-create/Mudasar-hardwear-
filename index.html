<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudasar Hardware Store</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f4; text-align: center; }
        header { background: var(--primary); color: white; padding: 20px; }
        
        .container { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
        
        /* Product Card Style */
        .product-card { 
            background: white; border-radius: 8px; margin: 10px; padding: 15px; 
            width: 250px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        .product-card h3 { margin: 10px 0; font-size: 1.2rem; }
        .price { color: #27ae60; font-weight: bold; font-size: 1.1rem; }
        
        button { 
            background: var(--accent); color: white; border: none; padding: 10px 15px; 
            cursor: pointer; border-radius: 5px; margin-top: 10px; width: 100%;
        }
        button:hover { opacity: 0.9; }

        /* Cart Section */
        #cart-section { 
            background: white; padding: 20px; margin: 20px auto; max-width: 600px; 
            border-top: 5px solid var(--accent); border-radius: 8px;
        }
        .cart-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 5px 0; }
        .summary { margin-top: 20px; font-size: 1.1rem; text-align: left; }
        .whatsapp-btn { background: #25D366; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

<header>
    <h1>Mudasar Hardware Store</h1>
    <p>Behtreen Quality, Behtreen Daam</p>
</header>

<div class="container">
    <div class="product-card">
        <img src="https://via.placeholder.com/200" alt="Hathora">
        <h3>Steel Hathora (Hammer)</h3>
        <p class="price">Rs. 500</p>
        <button onclick="addToCart('Steel Hathora', 500)">Add to Cart</button>
    </div>
    <div class="product-card">
        <img src="https://via.placeholder.com/200" alt="Screw Driver">
        <h3>Screw Driver Set</h3>
        <p class="price">Rs. 1200</p>
        <button onclick="addToCart('Screw Driver Set', 1200)">Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/200" alt="Drill Machine">
        <h3>Power Drill Machine</h3>
        <p class="price">Rs. 4500</p>
        <button onclick="addToCart('Power Drill Machine', 4500)">Add to Cart</button>
    </div>
</div>

<div id="cart-section">
    <h2>Aapka Cart</h2>
    <div id="cart-items"></div>
    
    <div class="summary">
        <p>Total Bill: <b>Rs. <span id="total-price">0</span></b></p>
        <p>Advance (50%): <b style="color:red;">Rs. <span id="advance-price">0</span></b></p>
        <p>Baqi (Cash on Delivery): <b>Rs. <span id="cod-price">0</span></b></p>
    </div>
    
    <button class="whatsapp-btn" onclick="sendToWhatsApp()">Order on WhatsApp</button>
</div>

<script>
    let cart = [];
    let total = 0;

    function addToCart(name, price) {
        cart.push({name, price});
        total += price;
        updateCartUI();
    }

    function updateCartUI() {
        const cartDiv = document.getElementById('cart-items');
        cartDiv.innerHTML = '';
        
        cart.forEach((item, index) => {
            cartDiv.innerHTML += `<div class="cart-item"><span>${item.name}</span> <span>Rs. ${item.price}</span></div>`;
        });

        document.getElementById('total-price').innerText = total;
        document.getElementById('advance-price').innerText = (total * 0.5);
        document.getElementById('cod-price').innerText = (total * 0.5);
    }

    function sendToWhatsApp() {
        if(cart.length === 0) {
            alert("Cart khali hai!");
            return;
        }

        let phoneNumber = "923001234567"; // <-- Yahan apna WhatsApp number likhein
        let message = "*Naya Order - Mudasar Hardware Store*%0A%0A";
        
        cart.forEach((item, i) => {
            message += `${i+1}. ${item.name} - Rs. ${item.price}%0A`;
        });

        message += `%0A*Total Bill:* Rs. ${total}`;
        message += `%0A*Advance (50%):* Rs. ${total * 0.5}`;
        message += `%0A*Cash on Delivery:* Rs. ${total * 0.5}`;
        message += `%0A%0ABraye Meharbani order confirm karein.`;

        window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
    }
</script>

</body>
</html>
