<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Store - Billing System</title>

<style>
body{font-family:Segoe UI;margin:0;background:#f5f7fa;}
header{background:#111;color:#fff;padding:15px;text-align:center;}

/* SEARCH */
.searchBox{
padding:15px;
text-align:center;
}
.searchBox input{
width:60%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

/* CARD */
.card{
background:white;
padding:10px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

img{width:100%;height:150px;object-fit:cover;border-radius:10px;}

button{
width:100%;
padding:10px;
margin-top:5px;
border:none;
background:#6366f1;
color:white;
border-radius:8px;
cursor:pointer;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:300px;
height:100%;
background:white;
padding:10px;
box-shadow:-10px 0 30px rgba(0,0,0,.2);
overflow:auto;
}

#printArea{
display:none;
padding:20px;
background:white;
}

</style>
</head>

<body>

<header>
<h2>Hardware Store Billing System</h2>
</header>

<!-- SEARCH -->
<div class="searchBox">
<input id="search" onkeyup="searchProduct()" placeholder="Search product...">
</div>

<!-- PRODUCTS -->
<div class="grid" id="products"></div>

<!-- CART -->
<div class="cart">
<h3>Cart</h3>
<div id="cart"></div>
<p><b>Total: Rs <span id="total">0</span></b></p>

<button onclick="generateBill()">Generate Bill</button>
<button onclick="printBill()">Print Bill</button>
</div>

<!-- PRINT AREA -->
<div id="printArea">
<h2>🧾 Invoice Bill</h2>
<div id="billDetails"></div>
</div>

<script>

/* DATA */
let products = [
{name:"Screws Box",price:250,img:"https://images.unsplash.com/photo-1586864387967-d02ef85d93e8"},
{name:"Hinges Set",price:580,img:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c"},
{name:"Drawer Channel",price:1900,img:"https://images.unsplash.com/photo-1582582494700-9c0f77fa6f8a"}
];

let cart = [];

/* SHOW PRODUCTS */
function showProducts(list){
let div=document.getElementById("products");
div.innerHTML="";
list.forEach((p,i)=>{
div.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<p>Rs ${p.price}</p>
<button onclick="addToCart(${i})">Add</button>
</div>`;
});
}
showProducts(products);

/* SEARCH */
function searchProduct(){
let val=document.getElementById("search").value.toLowerCase();
let filtered=products.filter(p=>p.name.toLowerCase().includes(val));
showProducts(filtered);
}

/* CART */
function addToCart(i){
cart.push(products[i]);
loadCart();
}

function loadCart(){
let div=document.getElementById("cart");
div.innerHTML="";
let total=0;

cart.forEach(p=>{
div.innerHTML+=`${p.name} - Rs ${p.price}<br>`;
total+=p.price;
});

document.getElementById("total").innerText=total;
}

/* BILL GENERATE */
function generateBill(){
let bill=document.getElementById("billDetails");
bill.innerHTML="";

let total=0;

cart.forEach((p,i)=>{
bill.innerHTML+=`${i+1}. ${p.name} - Rs ${p.price}<br>`;
total+=p.price;
});

bill.innerHTML+=`<hr><b>Total: Rs ${total}</b>`;
document.getElementById("printArea").style.display="block";
}

/* PRINT BILL */
function printBill(){
let w=window.open("");
w.document.write(document.getElementById("printArea").innerHTML);
w.print();
w.close();
}

</script>

</body>
</html>
